name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

# Default deny; publish job elevates only what OIDC + GitHub Releases need.
permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "26.0"

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'chore/release-v') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.versions.outputs.sha }}
      tag: ${{ steps.versions.outputs.tag }}
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Resolve release ref
        id: vars
        env:
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            REF="$MERGE_COMMIT_SHA"
          else
            REF="$GITHUB_SHA"
          fi
          echo "target=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.target }}
          fetch-depth: 0

      # Verifies every version field agrees with the event context, tags the
      # commit, and creates the draft GitHub Release; writes sha/tag/version
      # job outputs (scripts/release/finalize.sh keeps the details out of YAML).
      - name: Verify, tag, and draft the release
        id: versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release/finalize.sh

  build:
    name: Build - ${{ matrix.settings.target }}
    needs: prepare
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26
            target: aarch64-apple-darwin
            build: pnpm build --target aarch64-apple-darwin
          - host: macos-26
            target: x86_64-apple-darwin
            build: pnpm build --target x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm build --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build --target aarch64-pc-windows-msvc

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Verify release commit
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual but the release commit is $EXPECTED_SHA"
            exit 1
          fi
        shell: bash

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.settings.target }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native addon
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            *.node
            index.mjs
            index.d.ts
          if-no-files-found: error

  github-release:
    name: Upload release assets
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Verify release commit
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual but the release commit is $EXPECTED_SHA"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          merge-multiple: true
          path: dist

      # Verifies the six platform binaries, writes SHA-256 checksums, and
      # uploads both to the draft release (scripts/release/upload-assets.sh).
      - name: Upload release assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/release/upload-assets.sh

  publish:
    name: Publish to npm
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    # Optional GitHub Environment: add required reviewers / wait timer in repo settings.
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Verify release commit
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual but the release commit is $EXPECTED_SHA"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          # npm trusted-publishing guidance: never cache the package manager in release builds.
          package-manager-cache: false
          # Do NOT set registry-url: setup-node writes
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} to .npmrc, and npm
          # presents that empty placeholder instead of exchanging the OIDC token,
          # producing E401 "authentication token seems to be invalid".

      - name: Ensure npm supports staged publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version
          node -e "
            const [major, minor] = require('child_process')
              .execSync('npm --version', { encoding: 'utf8' })
              .trim()
              .split('.')
              .map(Number);
            if (major < 11 || (major === 11 && minor < 15)) {
              console.error('Staged publishing requires npm >= 11.15.0');
              process.exit(1);
            }
          "

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create npm dirs
        run: pnpm exec napi create-npm-dirs

      - name: Move artifacts
        run: pnpm artifacts

      - name: Restore generated loader
        run: |
          set -euo pipefail
          restored=0
          for dir in artifacts/bindings-*/; do
            if [ -f "${dir}index.mjs" ] && [ -f "${dir}index.d.ts" ]; then
              cp "${dir}index.mjs" "${dir}index.d.ts" .
              echo "Restored index.mjs and index.d.ts from ${dir}"
              restored=1
              break
            fi
          done
          if [ "$restored" -ne 1 ]; then
            echo "::error::Missing generated index.mjs/index.d.ts in build artifacts"
            exit 1
          fi

      - name: Verify platform packages
        run: |
          set -euo pipefail
          expected=(
            darwin-x64
            darwin-arm64
            linux-x64-gnu
            linux-arm64-gnu
            win32-x64-msvc
            win32-arm64-msvc
          )
          missing=0
          for platform in "${expected[@]}"; do
            dir="npm/${platform}"
            nodes=( "${dir}"/*.node )
            if [ ! -d "${dir}" ]; then
              echo "::error::Missing platform package directory ${dir}"
              missing=1
              continue
            fi
            if [ ! -e "${nodes[0]}" ]; then
              echo "::error::Missing .node binary in ${dir}"
              missing=1
              continue
            fi
            echo "OK ${dir}: $(basename "${nodes[0]}")"
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to publish with incomplete platform artifacts"
            ls -laR npm artifacts || true
            exit 1
          fi

      - name: List packages
        run: ls -laR ./npm
        shell: bash

      # Stages via npm trusted publishing (OIDC). No long-lived NPM_TOKEN.
      # Configure a Trusted Publisher on npmjs.com for the root package and each
      # platform package (Package → Settings → Trusted publishing → GitHub
      # Actions), with: org `troplabs`, repo `sftp-client-native`, workflow
      # filename `release.yml`, environment name `npm` (this job uses
      # `environment: npm`), and only the `npm stage publish` action allowed
      # (the default for new configurations). npm does not validate the
      # configuration on save — every field is case-sensitive and must match
      # exactly. Direct `npm publish` is intentionally not permitted.
      # Nothing goes live here: a maintainer approves each staged version with
      # 2FA on npmjs.com (Staged Packages tab) or via `npm stage approve`.
      # OIDC trust tokens cannot run `npm stage list`/`approve`, so approval is
      # always a manual step outside CI.
      # Provenance attestations are generated automatically with trusted publishing.
      - name: Stage packages for release
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::Refusing to publish with a long-lived npm token in the environment. Use npm trusted publishing (OIDC) only."
            exit 1
          fi
          # Platform packages first so the root package's optionalDependencies
          # are already staged when it is staged.
          for dir in npm/*/; do
            echo "Staging platform package ${dir}"
            npm stage publish --access public "${dir}"
          done
          npm stage publish --access public
          {
            echo ""
            echo "### Next step: approve the staged versions"
            echo ""
            echo "All 7 packages are staged but **not yet live**. A maintainer must approve each staged version with 2FA:"
            echo ""
            echo "- On npmjs.com, in the Staged Packages tab, or"
            echo "- Locally: \`npm stage list\`, then \`npm stage approve <stage-id>\` per package"
            echo ""
            echo "Approve the six platform packages **before** \`@troplabs/sftp-client-native\` so its optionalDependencies resolve on the first install."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
