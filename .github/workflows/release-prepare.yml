name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.3)"
        required: true
        type: string

concurrency:
  group: release-prepare-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Validates INPUT_VERSION, bumps all version fields, pushes the
      # chore/release-v* branch, and opens the release PR (scripts/release/
      # prepare.sh keeps the details out of YAML).
      - name: Prepare release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release/prepare.sh
